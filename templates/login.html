{% extends "base.html" %}

{% block content %}

<div class="admin-login">

    <div class="login-card">

        <img
            src="{{ url_for('static', filename='img/logo.png') }}"
            class="login-logo">

        <h2 class="login-title">
            Acceso Talento Humano
        </h2><br>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">

                <label>
                    Correo corporativo
                </label>

                <input
                    type="email"
                    name="correo"
                    class="form-control"
                    required>

            </div>

            <div class="form-group">

                <label>
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn-login">

                Ingresar

            </button>

        </form>

    </div>

</div>

{% endblock %}
